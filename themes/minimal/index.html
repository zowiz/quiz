<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeux Riddles — Fun</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap");
      :root{
        --ink:#17152b;
        --purple:#7057e8;
        --purple-soft:#eeeaff;
        --yellow:#ffe45c;
        --pink:#ff6f91;
        --blue:#55c8ff;
        --green:#65d88b;
        --red:#ef5350;
        --cream:#fffaf2;
        --line:#e8dfd3;
      }
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%;font-family:Nunito,system-ui,sans-serif;background:#fff;color:var(--ink)}
      button,input,textarea{font:inherit}
      button{cursor:pointer}
      .app{min-height:100vh;display:grid;place-items:center;padding:20px 10px;background:#fff}
      .quiz{
        position:relative;width:360px;max-width:92vw;aspect-ratio:9/16;
        background:var(--cream);border:2px solid var(--ink);border-radius:30px;
        overflow:hidden;box-shadow:9px 10px 0 var(--ink)
      }
      .quiz::before,.quiz::after{
        content:"";position:absolute;pointer-events:none;z-index:0;border:3px solid transparent;border-radius:50%
      }
      .quiz::before{
        width:620px;height:310px;left:-250px;top:8%;border-color:rgba(255,111,145,.18);
        transform:rotate(-12deg);box-shadow:0 65px 0 -1px rgba(85,200,255,.15),0 130px 0 -1px rgba(101,216,139,.13)
      }
      .quiz::after{
        width:600px;height:290px;right:-245px;bottom:6%;border-color:rgba(85,200,255,.16);
        transform:rotate(13deg);box-shadow:0 -62px 0 -1px rgba(101,216,139,.13),0 -124px 0 -1px rgba(255,111,145,.11)
      }
      .quiz-content{position:relative;z-index:2;height:100%;padding:18px;display:flex;flex-direction:column}
      .top-row{display:flex;align-items:center}
      .logo{display:flex;align-items:baseline;gap:7px;transform:rotate(-2deg)}
      .logo-main{font-family:"Baloo 2",sans-serif;font-size:24px;font-weight:800;letter-spacing:-.04em;color:var(--purple)}
      .logo-by{font-size:10px;color:#777;font-weight:900;letter-spacing:.04em}
      .fullscreen{
        position:absolute;top:15px;right:15px;width:38px;height:38px;border:2px solid var(--ink);
        border-radius:13px;background:#fff;color:var(--ink);font-size:18px;font-weight:900;box-shadow:3px 3px 0 var(--ink)
      }
      .riddle-area{flex:1;display:flex;align-items:center}
      .riddle-card{
        position:relative;width:100%;text-align:left;background:#eeeaff;border:2px solid var(--ink);
        border-radius:24px;padding:34px 18px 0;cursor:pointer;overflow:visible;
        box-shadow:6px 7px 0 var(--purple);transition:transform .18s ease,box-shadow .18s ease
      }
      .riddle-card:hover{transform:translate(-2px,-2px);box-shadow:8px 9px 0 var(--purple)}
      .riddle-card:active{transform:translate(2px,2px);box-shadow:3px 4px 0 var(--purple)}
      .solve-overlay{
        position:absolute;z-index:5;top:0;left:50%;transform:translate(-50%,-50%) rotate(-2deg);
        white-space:nowrap;margin:0;padding:8px 16px;border:2px solid var(--ink);border-radius:999px;
        background:var(--red);color:#fff;font-size:12px;letter-spacing:.08em;font-weight:900;line-height:1.2;
        box-shadow:4px 4px 0 var(--ink);animation:hookIn .65s cubic-bezier(.2,.9,.2,1) both
      }
      .question{position:relative;z-index:2;font-family:"Baloo 2",sans-serif;font-size:24px;line-height:1.12;margin:0;font-weight:800;letter-spacing:-.02em;animation:questionIn .55s .12s cubic-bezier(.2,.9,.2,1) both}
      .hint{
        position:relative;z-index:2;display:flex;align-items:flex-start;gap:7px;margin-top:15px;
        font-size:12px;line-height:1.45;color:#514b60;font-weight:800
      }
      .hint + .hint{margin-top:7px}
      .hint-label{font-size:12px}
      .progress{position:relative;z-index:2;height:7px;width:calc(100% - 28px);margin:18px auto 0;background:#dcd5ea;overflow:hidden;border-radius:0 0 7px 7px}
      .progress-bar{height:100%;width:100%;background:var(--yellow);transition:width 1s linear}
      .timer{
        align-self:center;display:flex;align-items:center;gap:8px;margin:17px auto 18px;
        border:2px solid var(--ink);border-radius:999px;background:var(--yellow);padding:8px 18px;
        color:var(--ink);font-size:25px;font-weight:900;box-shadow:4px 5px 0 var(--ink);transition:transform .12s
      }
      .timer:active{transform:translate(2px,2px);box-shadow:2px 3px 0 var(--ink)}
      .timer:focus,.timer:focus-visible{outline:none}
      .timer.danger{animation:pulse .5s infinite}
      .answer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;color:#706979;font-size:9px;font-weight:900;letter-spacing:.08em}
      .answer-box{border-top:2px dashed #d8cec1;padding-top:12px}
      .tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
      .tile{
        width:32px;height:43px;display:grid;place-items:center;border:2px solid var(--ink);
        border-radius:11px;background:#fff;font-size:18px;font-weight:900;box-shadow:2px 2px 0 #c9c0b5
      }
      .tile.revealed{background:var(--green);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--ink);animation:pop .35s both}
      .answer-reveal{justify-content:center;margin-top:10px}
      .answer-reveal span{font-size:11px;font-weight:900;color:var(--purple)}
      .follow{align-self:center;margin-top:16px;color:var(--purple);font-size:9px;font-weight:900;letter-spacing:.1em}
      .modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(23,21,43,.48)}
      .modal-backdrop.open{display:flex}
      .riddle-form{width:min(420px,100%);max-height:90vh;overflow:auto;background:var(--cream);border:2px solid var(--ink);border-radius:24px;padding:20px;box-shadow:8px 9px 0 var(--ink)}
      .riddle-form h2{margin:0 0 18px;font-family:"Baloo 2",sans-serif;font-size:25px}
      .form-field{margin-bottom:12px}
      .form-field label{display:block;margin-bottom:6px;font-size:10px;font-weight:900;letter-spacing:.08em;color:#666}
      .form-field textarea,.form-field input{width:100%;border:2px solid #d8d0c5;border-radius:12px;padding:10px;background:#fff;color:var(--ink);font-size:13px;outline:none;resize:vertical}
      .form-field textarea:focus,.form-field input:focus{border-color:var(--purple);box-shadow:3px 3px 0 var(--purple-soft)}
      .form-actions{display:flex;gap:8px;margin-top:16px}
      .form-actions button{flex:1;border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:12px;font-weight:900;box-shadow:3px 3px 0 var(--ink)}
      .cancel-btn{background:#fff;color:#555}
      .submit-btn{background:var(--purple);color:#fff;border-color:var(--ink)!important}
      .confetti{position:absolute;bottom:-15px;width:9px;height:16px;z-index:20;pointer-events:none;border:1px solid var(--ink);animation:fall 1s ease-out forwards}
      @keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate3d(var(--x),-620px,0) rotate(var(--r));opacity:0}}
      @keyframes pulse{50%{transform:scale(1.06)}}
      @keyframes pop{0%{transform:scale(.7) rotate(-4deg)}70%{transform:scale(1.1) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
      @keyframes hookIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(-2deg) translateY(12px) scale(.85)}65%{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) translateY(-2px) scale(1.04)}100%{transform:translate(-50%,-50%) rotate(-2deg) translateY(0) scale(1)}}
      @keyframes questionIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
      @keyframes reveal{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
      .hint.reveal{animation:reveal .45s ease both}
      @media (prefers-reduced-motion:reduce){.solve-overlay,.question{animation:none}.riddle-card,.timer{transition:none}}
    </style>
  </head>
  <body>
    <div class="app">
      <main class="quiz" id="quiz">
        <div class="quiz-content">
          <div class="top-row"><div class="logo"><span class="logo-main" id="brandText"></span><span class="logo-by" id="creatorText"></span></div></div>
          <button class="fullscreen" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
          <div class="riddle-area">
            <button class="riddle-card" id="riddleCard">
              <span class="solve-overlay">CAN YOU SOLVE IT?</span>
              <p class="question" id="questionText"></p>
              <div class="hint" id="hintBox"><span class="hint-label">💡</span><span id="hintText"></span></div>
              <div class="hint" id="hintBox2" style="display:none"><span class="hint-label">💡</span><span id="hintText2"></span></div>
              <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            </button>
          </div>
          <button class="timer" id="timer" type="button"><span id="timerEmoji">😎</span><span id="timerText">10s</span></button>
          <div class="answer-header"><span>ANSWER • <span id="letterCount">0</span> LETTERS</span><span id="statusText">HIDDEN</span></div>
          <div class="answer-box"><div class="tiles" id="tiles"></div><div class="answer-reveal" id="answerReveal" style="display:none"><span id="revealedAnswer"></span></div></div>
          <div class="follow">RIDDLES BY ZEUX</div>
        </div>
      </main>
    </div>
    <div class="modal-backdrop" id="riddleModal">
      <form class="riddle-form" id="riddleForm">
        <h2>Edit Riddle</h2>
        <div class="form-field"><label for="riddleInput">1. RIDDLE</label><textarea id="riddleInput" rows="4" required></textarea></div>
        <div class="form-field"><label for="hint1Input">2. HINT 1</label><textarea id="hint1Input" rows="2" required></textarea></div>
        <div class="form-field"><label for="hint2Input">3. HINT 2</label><textarea id="hint2Input" rows="2" required></textarea></div>
        <div class="form-field"><label for="answerInput">4. ANSWER</label><input id="answerInput" required /></div>
        <div class="form-actions"><button type="button" class="cancel-btn" id="cancelRiddle">CANCEL</button><button type="submit" class="submit-btn">SUBMIT</button></div>
      </form>
    </div>
    <script>
      const CONFIG={question:"What has many teeth but cannot bite?",hint:"You might use me in the morning.",hint2:"I have many teeth arranged in a row.",answer:"comb",timerSeconds:10,hintTimerSeconds:5,hint2TimerSeconds:10,brand:"RIDDLES",creator:"by ZEUX"};
      let question=CONFIG.question,answer=CONFIG.answer.toUpperCase(),timeLeft=CONFIG.timerSeconds,revealed=false,timerRunning=false,hintVisible=false,hint2Visible=false,timerPhase="initial",timerId=null;
      const $=id=>document.getElementById(id);
      function updatePreview(){
        $("brandText").textContent=CONFIG.brand;$("creatorText").textContent=CONFIG.creator;$("questionText").textContent=question;
        $("hintText").textContent=hintVisible?CONFIG.hint:"Hint coming in 10s";$("hintText2").textContent=hint2Visible?CONFIG.hint2:"Hint coming in 5s";
        $("letterCount").textContent=answer.replace(/\s/g,"").length;$("statusText").textContent=revealed?"REVEALED":hint2Visible?"HINT 2":hintVisible?"HINT 1":"HIDDEN";
        $("timerText").textContent=revealed?"Time's up!":timeLeft+"s";$("timerEmoji").textContent=getTimerEmoji();
        const d=timerPhase==="initial"?CONFIG.timerSeconds:timerPhase==="hint"?CONFIG.hintTimerSeconds:CONFIG.hint2TimerSeconds;
        $("progressBar").style.width=Math.max(0,(timeLeft/d)*100)+"%";$("timer").classList.toggle("danger",timeLeft<=5&&timerRunning&&!revealed);renderTiles();
      }
      function renderTiles(){
        const t=$("tiles");t.innerHTML="";
        [...answer].forEach(l=>{if(l===" "){const s=document.createElement("div");s.style.width="12px";t.appendChild(s);return}
          const x=document.createElement("div");x.className="tile";x.textContent=revealed?l:"?";if(!revealed)x.style.color="#bdb7b0";else x.classList.add("revealed");t.appendChild(x)});
        $("answerReveal").style.display=revealed?"flex":"none";$("revealedAnswer").textContent=answer;
      }
      function getTimerEmoji(){if(timerPhase==="initial"){if(timeLeft>7)return"😎";if(timeLeft>4)return"😬";if(timeLeft>2)return"😰";return"🤯"}return timeLeft>2?"💡":"⏳"}
      function startTimer(){
        if(timerRunning||revealed)return;clearInterval(timerId);timerRunning=true;
        timerId=setInterval(()=>{if(!timerRunning||revealed)return;timeLeft--;updatePreview();
          if(timeLeft<=0){if(timerPhase==="initial"){hintVisible=true;timerPhase="hint";timeLeft=CONFIG.hintTimerSeconds;$("hintBox2").style.display="flex";updatePreview();$("hintBox").classList.remove("reveal");void $("hintBox").offsetWidth;$("hintBox").classList.add("reveal")}
          else if(timerPhase==="hint"){hint2Visible=true;timerPhase="hint2";timeLeft=CONFIG.hint2TimerSeconds;updatePreview();$("hintBox2").classList.remove("reveal");void $("hintBox2").offsetWidth;$("hintBox2").classList.add("reveal")}else reveal()}
        },1000)
      }
      function resetTimer(){revealed=false;hintVisible=false;hint2Visible=false;timerPhase="initial";timeLeft=CONFIG.timerSeconds;$("hintBox2").style.display="none";timerRunning=false;clearInterval(timerId);updatePreview()}
      function reveal(){revealed=true;timerRunning=false;clearInterval(timerId);updatePreview();launchConfetti()}
      function launchConfetti(){
        const q=$("quiz"),colors=["#FFE45C","#EF5350","#55C8FF","#65D88B","#FF6F91","#7057E8"];
        for(let i=0;i<55;i++){const p=document.createElement("div");p.className="confetti";p.style.left=8+Math.random()*84+"%";p.style.background=colors[i%colors.length];p.style.setProperty("--x",(Math.random()-.5)*280+"px");p.style.setProperty("--r",(Math.random()-.5)*720+"deg");p.style.animationDelay=Math.random()*.2+"s";q.appendChild(p);setTimeout(()=>p.remove(),1200)}
      }
      function openRiddleForm(){$("riddleInput").value=CONFIG.question;$("hint1Input").value=CONFIG.hint;$("hint2Input").value=CONFIG.hint2;$("answerInput").value=CONFIG.answer;$("riddleModal").classList.add("open")}
      function closeRiddleForm(){$("riddleModal").classList.remove("open")}
      $("riddleCard").onclick=e=>{e.preventDefault();openRiddleForm()};$("cancelRiddle").onclick=closeRiddleForm;
      $("riddleModal").onclick=e=>{if(e.target===$("riddleModal"))closeRiddleForm()};
      $("riddleForm").onsubmit=e=>{e.preventDefault();CONFIG.question=$("riddleInput").value.trim();CONFIG.hint=$("hint1Input").value.trim();CONFIG.hint2=$("hint2Input").value.trim();CONFIG.answer=$("answerInput").value.trim();question=CONFIG.question;answer=CONFIG.answer.toUpperCase();resetTimer()};
      $("timer").onclick=()=>{if(revealed)resetTimer();else if(!timerRunning)startTimer()};
      $("fullscreenBtn").onclick=async()=>{try{if(!document.fullscreenElement)await $("quiz").requestFullscreen();else await document.exitFullscreen()}catch(e){}};
      updatePreview();
    </script>
  </body>
</html>
