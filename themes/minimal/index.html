<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeux Riddles — Fun</title>
    <style>@import url("https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@500;700;800;900&display=swap");
:root{--ink:#171717;--paper:#fffdf7;--yellow:#ffd83d;--pink:#ff4f81;--blue:#35baf6;--green:#52d273;--purple:#7b5cff;--red:#f04444;--cream:#fff7df;--muted:#625d61}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",system-ui,sans-serif;background:#171717;color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;place-items:center;padding:18px 10px;background:#171717}
.quiz{position:relative;width:360px;max-width:92vw;aspect-ratio:9/16;background:var(--paper);border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.quiz::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.45;background-image:radial-gradient(var(--ink) 1px,transparent 1px);background-size:13px 13px;mask-image:linear-gradient(to bottom,transparent 0%,transparent 30%,#000 52%,#000 100%)}
.quiz::after{content:"";position:absolute;width:170px;height:170px;right:-70px;top:105px;background:var(--pink);border:3px solid var(--ink);border-radius:50%;z-index:0}
.quiz-content{position:relative;z-index:2;height:100%;padding:16px;display:flex;flex-direction:column}
.top-row{display:flex;align-items:center}.logo{display:flex;align-items:center;gap:6px}.logo-main{font-family:Anton,sans-serif;font-size:27px;line-height:1;letter-spacing:.01em}.logo-main::after{content:"";display:inline-block;width:9px;height:9px;margin-left:4px;background:var(--yellow);border:2px solid var(--ink);border-radius:50%;vertical-align:middle}.logo-by{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.08em}
.fullscreen{position:absolute;top:14px;right:14px;width:36px;height:36px;border:3px solid var(--ink);border-radius:50%;background:var(--blue);color:var(--ink);font-size:17px;font-weight:900}
.riddle-area{flex:1;display:flex;align-items:center}.riddle-card{position:relative;width:100%;text-align:left;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:38px 18px 0;cursor:pointer;overflow:visible;transform:rotate(-1deg);transition:transform .15s ease}.riddle-card:hover{transform:rotate(0)}.riddle-card:active{transform:rotate(1deg)}
.solve-overlay{position:absolute;z-index:5;top:0;left:50%;transform:translate(-50%,-50%) rotate(2deg);white-space:nowrap;padding:9px 16px;border:3px solid var(--ink);border-radius:5px;background:var(--pink);color:#fff;font-family:Anton,sans-serif;font-size:14px;letter-spacing:.04em;line-height:1;animation:hookIn .55s ease both}
.question{position:relative;z-index:2;font-family:Anton,sans-serif;font-size:29px;line-height:1.04;margin:0;text-transform:uppercase;letter-spacing:.01em;animation:questionIn .45s .08s ease both}
.hint{position:relative;z-index:2;display:flex;align-items:flex-start;gap:7px;margin-top:15px;font-size:12px;line-height:1.4;color:var(--ink);font-weight:800}.hint+.hint{margin-top:7px}.hint-label{font-size:13px}
.progress{position:relative;z-index:2;height:9px;width:calc(100% - 24px);margin:18px auto 0;background:#fff;border:2px solid var(--ink);overflow:hidden;border-radius:0}.progress-bar{height:100%;width:100%;background:var(--blue);transition:width 1s linear}
.timer{align-self:center;display:flex;align-items:center;gap:7px;margin:18px auto 17px;border:3px solid var(--ink);border-radius:7px;background:var(--blue);padding:8px 16px;color:var(--ink);font-family:Anton,sans-serif;font-size:25px;line-height:1}.timer:active{transform:none}.timer:focus,.timer:focus-visible{outline:none}.timer.danger{animation:shake .28s infinite}
.answer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--ink);font-size:9px;font-weight:900;letter-spacing:.08em}.answer-header span:last-child{background:var(--green);padding:3px 7px;border:2px solid var(--ink);border-radius:3px}.answer-box{border-top:3px solid var(--ink);padding-top:11px}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.tile{width:33px;height:43px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:5px;background:#fff;font-size:18px;font-weight:900}.tile.revealed{background:var(--green);color:var(--ink);animation:pop .3s both}
.answer-reveal{justify-content:center;margin-top:9px}.answer-reveal span{font-family:Anton,sans-serif;font-size:14px;color:var(--ink);letter-spacing:.05em}.follow{align-self:center;margin-top:14px;color:var(--ink);font-size:8px;font-weight:900;letter-spacing:.14em;background:var(--yellow);padding:3px 7px}
.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(23,23,23,.65)}.modal-backdrop.open{display:flex}.riddle-form{width:min(420px,100%);max-height:90vh;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:20px}.riddle-form h2{margin:0 0 18px;font-family:Anton,sans-serif;font-size:28px;text-transform:uppercase}.form-field{margin-bottom:12px}.form-field label{display:block;margin-bottom:6px;font-size:10px;font-weight:900;letter-spacing:.08em;color:var(--ink)}.form-field textarea,.form-field input{width:100%;border:3px solid var(--ink);border-radius:5px;padding:10px;background:#fff;color:var(--ink);font-size:13px;outline:none;resize:vertical}.form-field textarea:focus,.form-field input:focus{border-color:var(--purple);background:var(--cream)}.form-actions{display:flex;gap:8px;margin-top:16px}.form-actions button{flex:1;border:3px solid var(--ink);border-radius:5px;padding:10px;font-size:12px;font-weight:900}.cancel-btn{background:#fff;color:var(--ink)}.submit-btn{background:var(--purple);color:#fff;border-color:var(--ink)!important}
.confetti{position:absolute;bottom:-15px;width:10px;height:18px;z-index:20;pointer-events:none;border:2px solid var(--ink);animation:fall 1s ease-out forwards}@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translate3d(var(--x),-620px,0) rotate(var(--r));opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes hookIn{0%{opacity:0;transform:translate(-50%,-50%) rotate(2deg) scale(.8)}70%{opacity:1;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05)}100%{transform:translate(-50%,-50%) rotate(2deg) scale(1)}}@keyframes questionIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}@keyframes reveal{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}.hint.reveal{animation:reveal .4s ease both}@media (prefers-reduced-motion:reduce){.solve-overlay,.question{animation:none}.riddle-card{transition:none}}</style>
  </head>
  <body>
    <div class="app">
      <main class="quiz" id="quiz">
        <div class="quiz-content">
          <div class="top-row"><div class="logo"><span class="logo-main" id="brandText"></span><span class="logo-by" id="creatorText"></span></div></div>
          <button class="fullscreen" id="fullscreenBtn" aria-label="Fullscreen">⛶</button>
          <div class="riddle-area">
            <button class="riddle-card" id="riddleCard">
              <span class="solve-overlay">CAN YOU SOLVE IT?</span>
              <p class="question" id="questionText"></p>
              <div class="hint" id="hintBox"><span class="hint-label">💡</span><span id="hintText"></span></div>
              <div class="hint" id="hintBox2" style="display:none"><span class="hint-label">💡</span><span id="hintText2"></span></div>
              <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
            </button>
          </div>
          <button class="timer" id="timer" type="button"><span id="timerEmoji">😎</span><span id="timerText">10s</span></button>
          <div class="answer-header"><span>ANSWER • <span id="letterCount">0</span> LETTERS</span><span id="statusText">HIDDEN</span></div>
          <div class="answer-box"><div class="tiles" id="tiles"></div><div class="answer-reveal" id="answerReveal" style="display:none"><span id="revealedAnswer"></span></div></div>
          <div class="follow">RIDDLES BY ZEUX</div>
        </div>
      </main>
    </div>
    <div class="modal-backdrop" id="riddleModal">
      <form class="riddle-form" id="riddleForm">
        <h2>Edit Riddle</h2>
        <div class="form-field"><label for="riddleInput">1. RIDDLE</label><textarea id="riddleInput" rows="4" required></textarea></div>
        <div class="form-field"><label for="hint1Input">2. HINT 1</label><textarea id="hint1Input" rows="2" required></textarea></div>
        <div class="form-field"><label for="hint2Input">3. HINT 2</label><textarea id="hint2Input" rows="2" required></textarea></div>
        <div class="form-field"><label for="answerInput">4. ANSWER</label><input id="answerInput" required /></div>
        <div class="form-actions"><button type="button" class="cancel-btn" id="cancelRiddle">CANCEL</button><button type="submit" class="submit-btn">SUBMIT</button></div>
      </form>
    </div>
    <script>
      const CONFIG={question:"What has many teeth but cannot bite?",hint:"You might use me in the morning.",hint2:"I have many teeth arranged in a row.",answer:"comb",timerSeconds:10,hintTimerSeconds:5,hint2TimerSeconds:10,brand:"RIDDLES",creator:"by ZEUX"};
      let question=CONFIG.question,answer=CONFIG.answer.toUpperCase(),timeLeft=CONFIG.timerSeconds,revealed=false,timerRunning=false,hintVisible=false,hint2Visible=false,timerPhase="initial",timerId=null;
      const $=id=>document.getElementById(id);
      function updatePreview(){
        $("brandText").textContent=CONFIG.brand;$("creatorText").textContent=CONFIG.creator;$("questionText").textContent=question;
        $("hintText").textContent=hintVisible?CONFIG.hint:"Hint coming in 10s";$("hintText2").textContent=hint2Visible?CONFIG.hint2:"Hint coming in 5s";
        $("letterCount").textContent=answer.replace(/\s/g,"").length;$("statusText").textContent=revealed?"REVEALED":hint2Visible?"HINT 2":hintVisible?"HINT 1":"HIDDEN";
        $("timerText").textContent=revealed?"Time's up!":timeLeft+"s";$("timerEmoji").textContent=getTimerEmoji();
        const d=timerPhase==="initial"?CONFIG.timerSeconds:timerPhase==="hint"?CONFIG.hintTimerSeconds:CONFIG.hint2TimerSeconds;
        $("progressBar").style.width=Math.max(0,(timeLeft/d)*100)+"%";$("timer").classList.toggle("danger",timeLeft<=5&&timerRunning&&!revealed);renderTiles();
      }
      function renderTiles(){
        const t=$("tiles");t.innerHTML="";
        [...answer].forEach(l=>{if(l===" "){const s=document.createElement("div");s.style.width="12px";t.appendChild(s);return}
          const x=document.createElement("div");x.className="tile";x.textContent=revealed?l:"?";if(!revealed)x.style.color="#bdb7b0";else x.classList.add("revealed");t.appendChild(x)});
        $("answerReveal").style.display=revealed?"flex":"none";$("revealedAnswer").textContent=answer;
      }
      function getTimerEmoji(){if(timerPhase==="initial"){if(timeLeft>7)return"😎";if(timeLeft>4)return"😬";if(timeLeft>2)return"😰";return"🤯"}return timeLeft>2?"💡":"⏳"}
      function startTimer(){
        if(timerRunning||revealed)return;clearInterval(timerId);timerRunning=true;
        timerId=setInterval(()=>{if(!timerRunning||revealed)return;timeLeft--;updatePreview();
          if(timeLeft<=0){if(timerPhase==="initial"){hintVisible=true;timerPhase="hint";timeLeft=CONFIG.hintTimerSeconds;$("hintBox2").style.display="flex";updatePreview();$("hintBox").classList.remove("reveal");void $("hintBox").offsetWidth;$("hintBox").classList.add("reveal")}
          else if(timerPhase==="hint"){hint2Visible=true;timerPhase="hint2";timeLeft=CONFIG.hint2TimerSeconds;updatePreview();$("hintBox2").classList.remove("reveal");void $("hintBox2").offsetWidth;$("hintBox2").classList.add("reveal")}else reveal()}
        },1000)
      }
      function resetTimer(){revealed=false;hintVisible=false;hint2Visible=false;timerPhase="initial";timeLeft=CONFIG.timerSeconds;$("hintBox2").style.display="none";timerRunning=false;clearInterval(timerId);updatePreview()}
      function reveal(){revealed=true;timerRunning=false;clearInterval(timerId);updatePreview();launchConfetti()}
      function launchConfetti(){
        const q=$("quiz"),colors=["#FFE45C","#EF5350","#55C8FF","#65D88B","#FF6F91","#7057E8"];
        for(let i=0;i<55;i++){const p=document.createElement("div");p.className="confetti";p.style.left=8+Math.random()*84+"%";p.style.background=colors[i%colors.length];p.style.setProperty("--x",(Math.random()-.5)*280+"px");p.style.setProperty("--r",(Math.random()-.5)*720+"deg");p.style.animationDelay=Math.random()*.2+"s";q.appendChild(p);setTimeout(()=>p.remove(),1200)}
      }
      function openRiddleForm(){$("riddleInput").value=CONFIG.question;$("hint1Input").value=CONFIG.hint;$("hint2Input").value=CONFIG.hint2;$("answerInput").value=CONFIG.answer;$("riddleModal").classList.add("open")}
      function closeRiddleForm(){$("riddleModal").classList.remove("open")}
      $("riddleCard").onclick=e=>{e.preventDefault();openRiddleForm()};$("cancelRiddle").onclick=closeRiddleForm;
      $("riddleModal").onclick=e=>{if(e.target===$("riddleModal"))closeRiddleForm()};
      $("riddleForm").onsubmit=e=>{e.preventDefault();CONFIG.question=$("riddleInput").value.trim();CONFIG.hint=$("hint1Input").value.trim();CONFIG.hint2=$("hint2Input").value.trim();CONFIG.answer=$("answerInput").value.trim();question=CONFIG.question;answer=CONFIG.answer.toUpperCase();resetTimer()};
      $("timer").onclick=()=>{if(revealed)resetTimer();else if(!timerRunning)startTimer()};
      $("fullscreenBtn").onclick=async()=>{try{if(!document.fullscreenElement)await $("quiz").requestFullscreen();else await document.exitFullscreen()}catch(e){}};
      updatePreview();
    </script>
  </body>
</html>
